experiment:
  seeds: [7, 11, 19, 23, 29, 31, 37, 41, 43, 47]
  protocols:
    - leach
    - leach_c
    - greedy
    - pso_only
    - markov_pso
    - ml_pso
    - proposed

network:
  n_nodes: 200
  width_m: 1000.0
  height_m: 1000.0
  sink_x_m: 500.0
  sink_y_m: 500.0
  initial_energy_j: 2.0
  communication_radius_m: 100.0
  packet_bits: 4000
  rounds: 1000
  cluster_head_fraction: 0.05
  cluster_refresh_interval: 20
  route_refresh_interval: 50

radio:
  e_elec_j_per_bit: 5.0e-8
  e_fs_j_per_bit_m2: 1.0e-11
  e_mp_j_per_bit_m4: 1.3e-15
  e_da_j_per_bit: 5.0e-9
  e_sense_j_per_bit: 5.0e-9

environment:
  base_temperature_c: 25.0
  temperature_amplitude_c: 12.0
  traffic_min: 0.35
  traffic_max: 1.00
  link_noise_std: 0.05
  energy_harvesting_enabled: true
  max_harvest_j_per_round: 0.0015

markov:
  laplace_alpha: 1.0

ml:
  telemetry_steps: 40
  n_estimators: 120
  max_depth: 10
  min_samples_leaf: 2
  validation_fraction: 0.20

pso:
  swarm_size: 30
  max_iterations: 100
  inertia: 0.72
  cognitive: 1.49
  social: 1.49
  lower_bound: -3.0
  upper_bound: 3.0
  early_stop_patience: 15
  early_stop_tolerance: 1.0e-6

qos:
  latency_budget_ms: 10.0
  min_link_reliability: 0.90
  edge_processing_delay_ms: 0.20
  propagation_speed_m_per_s: 3.0e8
  nominal_bitrate_bps: 1.0e7

proposed_weights:
  residual_energy: 0.35
  link_quality: 0.20
  centrality: 0.15
  predicted_drain: 0.20
  traffic: 0.10

statistics:
  bootstrap_samples: 2000
  confidence: 0.95
